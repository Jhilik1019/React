<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>Quiz Session</h1>

        <div id="quiz-box">
            <h2 id="question">Question text</h2>

            <div class="options">
                <button class="btn" onclick="checkAnswer(0)">Option 1</button>
                <button class="btn" onclick="checkAnswer(1)">Option 2</button>
                <button class="btn" onclick="checkAnswer(2)">Option 3</button>
                <button class="btn" onclick="checkAnswer(3)">Option 4</button>
            </div>

            <div id="status"></div>

            <button id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </div>

    </div>

    <script src="add.js"></script>
</body>
</html>
